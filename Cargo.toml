[workspace]
resolver = "2"
members = ["crates/format", "crates/core", "crates/cli", "crates/desktop", "crates/grpc-testserver"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matheusmalagris/protoglot"
description = "Local-first, git-friendly multiprotocol API client"

[workspace.dependencies]
# shared external deps (single source of versions)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "http2"] }
serde_json_path = "0.7"
base64 = "0.22"
aws-sigv4 = "1"
aws-credential-types = "1"
csv = "1"
jsonschema = { version = "0.26", default-features = false }
similar = "2"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tonic = "0.12"
prost = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
prost-types = "0.13"
protox = "0.7"
http = "1"
sxd-document = "0.3"
sxd-xpath = "0.4"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
futures = "0.3"
notify = "6"
boa_engine = "0.20"

# internal crates — version required for crates.io publish (^0.1.2 covers 0.1.x).
protoglot-format = { path = "crates/format", version = "0.1.2" }
protoglot-core = { path = "crates/core", version = "0.1.2" }

[profile.release]
strip = true
lto = "thin"
