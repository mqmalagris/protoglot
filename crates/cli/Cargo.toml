[package]
name = "protoglot-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local-first, git-friendly multiprotocol API client (REST/GraphQL/SOAP/WebSocket/gRPC) with a CI-first CLI"
keywords = ["api", "http", "grpc", "graphql", "cli"]
categories = ["command-line-utilities", "development-tools::testing"]

[[bin]]
name = "protoglot"
path = "src/main.rs"

# Short alias — same binary, fewer keystrokes (`pglot test ./api`).
[[bin]]
name = "pglot"
path = "src/main.rs"

[dependencies]
protoglot-core.workspace = true
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
notify.workspace = true
