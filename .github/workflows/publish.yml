name: Publish to crates.io

# Manual trigger — run from the Actions tab when you want to publish the current
# main to crates.io. Publishes in dependency order (format → core → cli).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p protoglot-format --locked
          cargo publish -p protoglot-core --locked
          cargo publish -p protoglot-cli --locked
