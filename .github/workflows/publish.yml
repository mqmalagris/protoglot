name: Publish to crates.io

# Publishes to crates.io in dependency order (format → core → cli) — on a
# version tag (alongside the binary release), or manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p protoglot-format --locked
          cargo publish -p protoglot-core --locked
          cargo publish -p protoglot-cli --locked
