name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release + upload assets
  id-token: write # OIDC for Sigstore signing
  attestations: write # write SLSA build-provenance attestations

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          # Both macOS targets build on the Apple-Silicon runner (x86_64 is
          # cross-compiled) — avoids the scarce, slow macos-13 Intel runners.
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # The desktop app (egui + rfd) needs GUI/GTK dev libs to build on Linux.
      - name: Install Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Build
        run: cargo build --release -p protoglot-cli -p protoglot-desktop --target ${{ matrix.target }} --locked

      - name: Package
        id: package
        shell: bash
        run: |
          ver="${{ github.ref_name }}"
          t="${{ matrix.target }}"
          rel="target/$t/release"
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"

          pkg() { # $1 = archive name prefix; rest = binary basenames
            name="$1"; shift
            dist="$name-$ver-$t"
            mkdir "$dist"
            for b in "$@"; do cp "$rel/$b$ext" "$dist/"; done
            cp README.md LICENSE-MIT LICENSE-APACHE "$dist/"
            if [ "${{ runner.os }}" = "Windows" ]; then
              7z a "$dist.zip" "$dist" >/dev/null && echo "$dist.zip"
            else
              tar czf "$dist.tar.gz" "$dist" && echo "$dist.tar.gz"
            fi
          }

          cli=$(pkg protoglot protoglot pglot)
          gui=$(pkg protoglot-desktop protoglot-desktop)
          {
            echo "assets<<EOF"
            echo "$cli"
            echo "$gui"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package.outputs.assets }}

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.assets }}
          generate_release_notes: true
